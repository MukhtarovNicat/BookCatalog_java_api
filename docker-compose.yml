services:
  postgres:
    image: postgres:16-alpine
    container_name: bookcatalog-db
    environment:
      POSTGRES_DB: bookcatalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: